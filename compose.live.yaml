services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.live
    init: true
    network_mode: host
    user: "${SDR_UID:?set host UID}:${SDR_GID:?set host GID}"
    environment:
      SDR_ORIGIN: http://localhost:18335
      SDR_LIVE_CONFIG: /config/live.json
      SDR_DEVICE_LOCK_DIR: /device
      SDR_CAS_EXECUTABLE: /cas/bin/arib-b25-stream-test
      LD_LIBRARY_PATH: /cas/lib
      PCSCLITE_CSOCK_NAME: /pcsc/pcscd.comm
    volumes:
      - ${SDR_LIVE_DATA:?set new data directory}:/data
      - ${SDR_RESEARCH_SOURCE:?set pinned research checkout}:/research:ro
      - ${SDR_RESEARCH_DEVICE_DIR:?set shared research device directory}:/device
      - ${SDR_LIVE_CONFIG_DIR:?set configuration directory}:/config:ro
      - ${SDR_CAS_DIR:?set unchanged CAS prefix}:/cas:ro
      - ${SDR_PCSC_DIR:?set prepared PCSC socket directory}:/pcsc:ro
      - /sys/bus/usb:/sys/bus/usb:ro
      - /sys/devices:/sys/devices:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    cpus: 8
    stop_grace_period: 45s
